<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container{
            background-color: coral;
            height: 100px;
            width: 100px;
            margin: 5px;
        }

        #third{
            background-color: purple;
        }

        [data-container]{
            background-color: yellow; 
        }

        [data-container="hello world"]{
            background-color: blue;
        }
    </style>
</head>
<body>
    <h1 style="background-color: blue;">Heading 1</h1>
    <h2>Heading 2</h2>

    <p >Lorem ipsum dolor sit amet consectetur adipisicing.</p>

    <div class="container">1</div>
    <div class="container">2</div>
    <div class="container" id="third">3</div>
    <div class="container" data-container="hello">4</div>

    <div class="container" data-container="hello world">5</div>

    <div class="container-1">
        hello
    </div>
</body>
</html>
